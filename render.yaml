# Single-service fullstack deploy: Express serves the API *and* the React
# build (client/dist). One push, one URL, no CORS juggling.
# Deploy without connecting GitHub: Render Dashboard -> New -> Web Service
# -> paste your PUBLIC repo URL (e.g. https://github.com/YOU/stackit).
services:
  - type: web
    name: stackit
    runtime: node
    buildCommand: npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
